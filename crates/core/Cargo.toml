[package]
name = "rsk-core"
version = "0.1.0"
edition = "2024"
description = "Side-effect-free Rootstock/Bitcoin core: deterministic chain state in redb, no concurrency or I/O in the logic"

[dependencies]
alloy-primitives = { version = "1.5.4", features = ["rlp"] }
alloy-rlp = "0.3.13"
bitcoin = "0.32.8"
hex = "0.4.3"
redb = "2"
rsk-consensus = { path = "../rsk-consensus" }
thiserror = "2.0.18"

[lints.clippy]
unwrap_used = "deny"

[lints.rust]
# `cfg(kani)` gates the proof module; rustc does not know it by default.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dev-dependencies]
bolero = "0.13"
eyre = "0.6"
proptest = "1"
# 0.9 is source-identical but requires proptest 1.12; 0.8 keeps the current 1.11.
proptest-state-machine = "0.8"
