[package]
name = "rsk-cli"
version = "0.1.0"
edition = "2024"
description = "Command line for the Rske node: a thin wrapper over the `rsk` library"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
rsk = { path = "../rsk" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[lints.clippy]
unwrap_used = "deny"
