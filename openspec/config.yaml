schema: spec-driven

context: |
  Wrap Markdown prose at 80 columns so the files stay readable in a terminal.
  Leave tables, fenced code blocks, long links, and `**Source**:` metadata
  lines unwrapped on one line. When a `**Source**:` line wraps, the OpenSpec
  parser reads the next lines as requirement text.

  Read `docs/core-verification.md` before writing a test. It states the five
  verification layers, the boundary rule and the mutation triage rule.

  `rsk-core` is a deterministic state machine. Every state change goes through
  `Core::apply(Action)` in one `redb` transaction. The logic has no clock, no
  network and no I/O. `Core::state()` returns the whole stored state for tests.

  Requirement IDs are append-only and they appear in the requirement heading.
  The executable form of a requirement lives in `crates/core/specs/`, and the
  test name carries the requirement ID.

  Run `scripts/verify.sh` before you ask for review. Add `--full` to run the
  Kani proofs too.

rules:
  specs:
    - Each requirement ID (`[HDR-xx]`, `[BTC-xx]`, `[FIN-xx]`, `[RSK-xx]`) is
      append-only and must appear in the requirement heading.
    - Keep each requirement under 500 characters. Keep each `**Source**:`
      metadata entry on one line so the parser excludes it from the count.
    - Every numeric or order boundary (`<`, `<=`, `>`, `>=`, window size N)
      must have scenarios for the exact boundary and one step past it.
  design:
    - Record every intentional difference from Bitcoin Core or rskj in a
      deviation table.
    - State-machine reference models must predict the full relevant `CoreState`
      and `Outcome` fields, not only a hash set.
    - An excluded mutation target must name its reason and its location.
    - A skipped verification layer gets one line in the design, with the reason.
  tasks:
    - Capability scenario tests must call `Core::apply` with production
      validation flags enabled. Do not disable difficulty checks in capability
      tests.
    - Write scenario tests and `ReferenceStateMachine` models from `spec.md`
      and public `Core` types. Do not copy implementation branches into the
      reference model.
    - Name every verification layer in the tasks. The layers are scenario,
      state machine, mutation, Kani and fuzzing. State each layer the change
      uses and each it skips, with the reason.
    - Pure integer arithmetic adds a `#[kani::proof]` in a
      `#[cfg(kani)] mod proofs` block in the file that owns the function.
    - A new byte parser adds a bolero check in
      `crates/core/tests/robustness.rs` and a target in `fuzz/`.
    - Run `openspec validate --all --strict` and
      `cargo test -p rsk-core --lib specs::` in the integration gate.
    - Audit test completeness with a scoped mutation run, one file at a time.
      Use `cargo mutants -p rsk-core -f PATH -- --lib`. Do not mutate the
      whole workspace. A narrower `specs::` filter is a fast loop only; confirm
      a survivor with `--lib`.
    - Before archive, write the change diff with
      `git diff origin/main..HEAD > pr.diff` and run
      `cargo mutants --in-diff pr.diff -p rsk-core -- --lib`.
    - Triage every missed mutant before you write a test. A spec violation
      gets the test. Unspecified behaviour gets a specification change first.
      An equivalent mutant gets the redundant branch deleted, or a config
      exclusion with a reason.
