name: verify

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Nightly audit. The scoped mutation run replays the lib suite for every
    # mutant and costs about two hours on each of eight shards, so it does not
    # run on a pull request.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: Base ref for the diff-scoped mutation check
        required: false
        default: master
      shard:
        description: "Shard to run, as i/n. Leave empty to run every mutant."
        required: false

concurrency:
  # Keep the nightly audit in its own group. A push to `master` must not cancel
  # a two-hour mutation run, and the audit must not block the push.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The crates use no `#![feature]`; keep the toolchain fixed so a new stable
  # release cannot change the result under us.
  RUST_VERSION: "1.99.1"

jobs:
  kani:
    # A manual dispatch runs the mutation check alone.
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2

      # Kani ships its own toolchain and downloads CBMC on first use.
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup

      - name: Proofs
        run: cargo kani

  mutants:
    # One mutant costs about a minute of runner time, because each mutant
    # replays the whole lib suite. Keep the default pull-request path fast:
    # dispatch this workflow on the branch when you want the check before a
    # merge. The nightly job audits the scoped files in full.
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 180
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Mutation check on the diff
        env:
          RSK_PROPTEST_CASES: "16"
          BASE: ${{ inputs.base }}
          SHARD: ${{ inputs.shard }}
        run: |
          # Three dots: diff from the merge base. Two dots would report the
          # commits that landed on the base branch after the fork.
          git diff "origin/$BASE...HEAD" > pr.diff
          shard=()
          if [ -n "$SHARD" ]; then shard=(--shard "$SHARD"); fi
          cargo mutants --in-diff pr.diff -p rsk-core "${shard[@]}" -- --lib

  mutants-nightly:
    if: github.event_name == 'schedule'
    # The scoped files hold about 540 mutants. Eight shards keep each job near
    # two hours and below the six-hour job limit.
    timeout-minutes: 240
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # cargo-mutants counts shards from zero. The last shard is n-1.
        shard: ["0/8", "1/8", "2/8", "3/8", "4/8", "5/8", "6/8", "7/8"]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Scoped audit
        env:
          RSK_PROPTEST_CASES: "16"
        run: |
          cargo mutants -p rsk-core \
            -f crates/core/src/btc.rs \
            -f crates/core/src/btc/validation.rs \
            -f crates/core/src/btc/finality.rs \
            -f crates/core/src/btc/checkpoints.rs \
            -f crates/core/src/rsk.rs \
            -f crates/core/src/rsk/score.rs \
            -f crates/core/src/rsk/checkpoint.rs \
            -f crates/core/src/core.rs \
            --shard "${{ matrix.shard }}" -- --lib

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # An artifact name cannot hold a slash, so key it on the job index.
          name: mutants-${{ strategy.job-index }}
          path: mutants.out
          if-no-files-found: ignore

  fuzz-smoke:
    if: github.event_name != 'workflow_dispatch'
    # Non-blocking until the first green run: the fuzz crate has not been built
    # on Linux yet.
    continue-on-error: true
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Build targets
        working-directory: fuzz
        run: cargo fuzz build

      - name: Smoke run
        working-directory: fuzz
        run: |
          for target in checkpoints_text rsk_header_rlp btc_message; do
            cargo fuzz run "$target" -- -runs=10000
          done
