[package]
name = "rsk-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rsk-core = { path = "../crates/core" }
rsk-consensus = { path = "../crates/rsk-consensus" }
btc-p2p = { path = "../crates/btc-p2p" }

[[bin]]
name = "checkpoints_text"
path = "fuzz_targets/checkpoints_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rsk_header_rlp"
path = "fuzz_targets/rsk_header_rlp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "btc_message"
path = "fuzz_targets/btc_message.rs"
test = false
doc = false
bench = false

[workspace]
